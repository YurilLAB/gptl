[package]
name = "gptl-relay"
version = "0.1.0"
edition = "2021"
authors = ["GPTL Team Beta <security@gptl-project.org>"]
description = "GPTL Relay Server - Multi-layer security with MFA, IP restrictions, rate limiting, and audit logging"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gptl-project/gptl"

[[bin]]
name = "gptl-relay"
path = "src/main.rs"

[[bin]]
name = "secure-relay"
path = "src/bin/secure-relay.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.35", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }

# Authentication
argon2 = "0.5"
totp-rs = { version = "5.0", features = ["qr", "serde_support"] }

# Cryptography
ring = "0.17"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"

# Rate limiting
governor = "0.2"

# Session management
jsonwebtoken = "9.3"
uuid = { version = "1.7", features = ["v4", "serde"] }

# IP/geolocation
ipnet = "2.9"

# Configuration
toml = "0.8"

# CLI (for existing binary)
clap = { version = "4.4", features = ["derive"] }
comfy-table = "7.1"
dirs = "5.0"

# HTTP client for API calls
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# WebAuthn/FIDO2 - requires OpenSSL (use feature flag on platforms without it)
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"], default-features = false, optional = true }
webauthn-rs-proto = { version = "0.5", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }

# Other
rand = "0.8"
num_cpus = "1.16"
which = "6.0"
hex = "0.4"
url = "2.5"

# Internal dependencies (all platforms)
gptl-core = { path = "../gptl-core" }
gptl-routing = { path = "../gptl-routing" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = []
webauthn = ["dep:webauthn-rs", "dep:webauthn-rs-proto", "dep:openssl"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
