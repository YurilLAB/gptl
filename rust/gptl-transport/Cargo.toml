[package]
name = "gptl-transport"
version = "0.1.0"
edition = "2021"
authors = ["GPTL Team Beta <security@gptl-project.org>"]
description = "GPTL Transport Layer — cell protocol, circuit building, and SOCKS5 proxy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gptl-project/gptl"

[[bin]]
name = "gptl-client"
path = "src/bin/gptl-client.rs"

[[bin]]
name = "gptl-node"
path = "src/bin/gptl-node.rs"

[dependencies]
# Async runtime
tokio          = { version = "1.35", features = ["full"] }
tokio-util     = { version = "0.7", features = ["codec"] }

# Serialization
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
toml           = "0.8"

# Crypto
x25519-dalek   = { version = "2.0", features = ["static_secrets"] }
sha2           = "0.10"
hmac           = "0.12"
hkdf           = "0.12"
chacha20poly1305 = "0.10"
rand           = "0.8"
rand_core      = "0.6"
zeroize        = { version = "1.7", features = ["derive"] }
hex            = "0.4"

# Errors and logging
thiserror      = "1.0"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
dirs           = "5.0"
bytes          = "1.5"

[dev-dependencies]
tokio-test     = "0.4"
tempfile       = "3.8"
