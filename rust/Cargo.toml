[workspace]
members = [
    "gptl-core",
    "gptl-routing",
    "gptl-crypto",
    "gptl-relay",
    "gptl-cli",
    "gptl-transport",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["GPTL Team Beta <security@gptl-project.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gptl-project/gptl"
