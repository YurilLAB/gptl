[package]
name = "gptl-cli"
version = "0.1.0"
edition = "2021"
authors = ["GPTL Team Beta <security@gptl-project.org>"]
description = "GPTL Command-Line Interface — configure and manage your anonymity network"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gptl-project/gptl"

[[bin]]
name = "gptl"
path = "src/main.rs"

[dependencies]
clap      = { version = "4.4", features = ["derive"] }
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml      = "0.8"
colored   = "2"
dialoguer = "0.11"
comfy-table = "7.1"
dirs      = "5.0"
thiserror = "1.0"
